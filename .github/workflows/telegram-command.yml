name: Telegram Channel Command

on:
  push:
    branches: ["main"]
    paths:
      - "telegram/command.json"

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute Telegram command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, uuid, pathlib, subprocess, shutil, time

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN secret is not configured")

          with open("telegram/command.json", "r", encoding="utf-8") as f:
              root_cmd = json.load(f)

          chat_id = "@gutsuspace"
          allowed = {"send", "edit", "delete", "pin", "send_photo", "set_avatar", "inspect", "set_title", "set_description", "set_reactions", "create_invite", "batch"}

          def post_json(method, payload):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Telegram API error {e.code}: {body}")
              if not result.get("ok"):
                  raise SystemExit(f"Telegram API returned error: {result}")
              return result

          def set_avatar():
              svg = pathlib.Path("assets/gutsu-avatar.svg")
              png = pathlib.Path("/tmp/gutsu-avatar.png")
              if shutil.which("rsvg-convert") is None:
                  subprocess.run(["sudo", "apt-get", "update", "-qq"], check=True)
                  subprocess.run(["sudo", "apt-get", "install", "-y", "-qq", "librsvg2-bin"], check=True)
              subprocess.run(["rsvg-convert", "-w", "1024", "-h", "1024", "-o", str(png), str(svg)], check=True)

              boundary = "----GUTSU" + uuid.uuid4().hex
              parts = []
              parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{chat_id}\r\n".encode())
              parts.append(
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"photo\"; filename=\"gutsu-avatar.png\"\r\nContent-Type: image/png\r\n\r\n".encode()
                  + png.read_bytes() + b"\r\n"
              )
              parts.append(f"--{boundary}--\r\n".encode())
              body = b"".join(parts)
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/setChatPhoto",
                  data=body,
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      result = json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Telegram avatar error {e.code}: {err}")
              if not result.get("ok"):
                  raise SystemExit(f"Telegram avatar error: {result}")
              return result

          def execute(cmd):
              op = cmd.get("operation")
              if op not in allowed:
                  raise SystemExit(f"Unsupported operation: {op}")

              if op == "set_title":
                  return post_json("setChatTitle", {"chat_id": chat_id, "title": cmd["title"]})
              if op == "set_description":
                  return post_json("setChatDescription", {"chat_id": chat_id, "description": cmd["description"]})
              if op == "set_reactions":
                  return post_json("setChatAvailableReactions", {
                      "chat_id": chat_id,
                      "available_reactions": [{"type": "emoji", "emoji": e} for e in cmd.get("emojis", ["👍","🔥","💡"])],
                  })
              if op == "inspect":
                  chat = post_json("getChat", {"chat_id": chat_id})
                  count = post_json("getChatMemberCount", {"chat_id": chat_id})
                  return {"ok": True, "result": {"chat": chat.get("result", {}), "member_count": count.get("result")}}
              if op == "create_invite":
                  return post_json("createChatInviteLink", {
                      "chat_id": chat_id,
                      "name": cmd["name"],
                      "creates_join_request": bool(cmd.get("creates_join_request", False)),
                  })
              if op == "set_avatar":
                  return set_avatar()
              if op == "send":
                  return post_json("sendMessage", {
                      "chat_id": chat_id,
                      "text": cmd["text"],
                      "parse_mode": cmd.get("parse_mode", "HTML"),
                      "disable_web_page_preview": bool(cmd.get("disable_web_page_preview", True)),
                  })
              if op == "edit":
                  return post_json("editMessageText", {
                      "chat_id": chat_id,
                      "message_id": int(cmd["message_id"]),
                      "text": cmd["text"],
                      "parse_mode": cmd.get("parse_mode", "HTML"),
                      "disable_web_page_preview": bool(cmd.get("disable_web_page_preview", True)),
                  })
              if op == "delete":
                  return post_json("deleteMessage", {"chat_id": chat_id, "message_id": int(cmd["message_id"])})
              if op == "pin":
                  return post_json("pinChatMessage", {
                      "chat_id": chat_id,
                      "message_id": int(cmd["message_id"]),
                      "disable_notification": bool(cmd.get("disable_notification", True)),
                  })
              if op == "send_photo":
                  return post_json("sendPhoto", {
                      "chat_id": chat_id,
                      "photo": cmd["photo_url"],
                      "caption": cmd.get("caption", ""),
                      "parse_mode": cmd.get("parse_mode", "HTML"),
                  })
              raise SystemExit("Nested batch is not supported")

          if root_cmd.get("operation") == "batch":
              results = []
              for i, cmd in enumerate(root_cmd.get("commands", []), 1):
                  if cmd.get("operation") == "batch":
                      raise SystemExit("Nested batch is not supported")
                  result = execute(cmd)
                  item = {"index": i, "operation": cmd.get("operation"), "ok": bool(result.get("ok", True))}
                  if isinstance(result.get("result"), dict):
                      if "message_id" in result["result"]:
                          item["message_id"] = result["result"]["message_id"]
                      if "invite_link" in result["result"]:
                          item["invite_link"] = result["result"]["invite_link"]
                  results.append(item)
                  time.sleep(0.35)
              print(json.dumps({"operation": "batch", "ok": True, "results": results}, ensure_ascii=False))
          else:
              result = execute(root_cmd)
              out = {"operation": root_cmd.get("operation"), "ok": bool(result.get("ok", True))}
              if isinstance(result.get("result"), dict):
                  if "message_id" in result["result"]:
                      out["message_id"] = result["result"]["message_id"]
                  if "invite_link" in result["result"]:
                      out["invite_link"] = result["result"]["invite_link"]
              print(json.dumps(out, ensure_ascii=False))
          PY
