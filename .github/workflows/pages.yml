name: Deploy GUTSU.space
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate public build
        run: |
          python3 tools/security_audit.py --history
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/build_site.py --release --static-catalog
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inspect Pages HTTPS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"             | jq '{status, cname, html_url, https_enforced, protected_domain_state, pending_domain_unverified_at}'
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
